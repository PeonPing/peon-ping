name: OpenCode Adapter Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'adapters/opencode/**'
      - 'adapters/opencode.sh'
      - 'adapters/opencode.ps1'
      - 'adapters/kilo/**'
      - 'adapters/kilo.sh'
      - 'adapters/kilo.ps1'
      - 'tests/opencode-*.test.ts'
      - 'tests/kilo-compatibility.test.ts'
      - 'adapters/omp/**'
      - 'tests/omp-*.test.ts'
      - '.github/workflows/test-opencode-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/opencode/**'
      - 'adapters/opencode.sh'
      - 'adapters/opencode.ps1'
      - 'adapters/kilo/**'
      - 'adapters/kilo.sh'
      - 'adapters/kilo.ps1'
      - 'tests/opencode-*.test.ts'
      - 'tests/kilo-compatibility.test.ts'
      - 'adapters/omp/**'
      - 'tests/omp-*.test.ts'
      - '.github/workflows/test-opencode-adapter.yml'

jobs:
  vitest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: adapters/opencode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run
